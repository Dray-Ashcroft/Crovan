name: Build signed release APK

# Manual: Actions tab -> "Build signed release APK" -> Run workflow.
# Builds with R8 (minify + shrink resources), aligns, signs with the release key
# stored in repository secrets, verifies the signature, uploads the APK.

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go (current croc engine)
        uses: actions/setup-go@v7
        with:
          go-version-file: third_party/croc-src/go.mod

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release (R8 + resource shrinking)
        run: |
          set +e
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            msg=$(grep -E "^e: |What went wrong|Execution failed|error:|Caused by|Could not|Unresolved|AAPT|R8|Missing class" -A2 build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle failure::$msg"
          fi
          exit $code

      - name: Align and sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::KEYSTORE_BASE64 secret is missing"; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Using build-tools: $BT"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "Unsigned APK: $UNSIGNED"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          mkdir -p dist
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out dist/Kroc-Sauria-release.apk \
            "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs dist/Kroc-Sauria-release.apk
          sha256sum dist/Kroc-Sauria-release.apk | tee dist/SHA256.txt
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: kroc-sauria-release
          path: dist/*
